name: Liberar GitHub Pages
on:
  push:
    branches: [main]
permissions:
  pages: write
  contents: read
jobs:
  liberar:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar publicação travada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/9814aa6f8dcbfcd5d9ca0ea65b1a4f090b42fb14/cancel"
