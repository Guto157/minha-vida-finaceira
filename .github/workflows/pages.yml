name: Publicar páginas do site

on:
  push:
    branches: [main]
    paths:
      - 'excluir-conta.html'
      - 'excluir-dados.html'
      - 'privacidade.html'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
